name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context (validation uses the selected branch)
        required: false
        default: '{}'
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Astro check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate types and content
        run: npm run check
      - name: Validate local image references
        run: npm run images:check
      - name: Run regression tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Validate generated pages
        run: npm run test:build
