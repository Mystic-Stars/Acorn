media:
  - name: posts
    label: 文章图片
    input: public/images/posts
    output: /images/posts
    rename: random
    extensions: [jpg, jpeg, png, webp, gif, avif, svg]
  - name: friends
    label: 友链头像
    input: public/images/friends
    output: /images/friends
    rename: random
    extensions: [jpg, jpeg, png, webp, gif, avif, svg, ico]
  - name: site
    label: 站点图片
    input: public/images/site
    output: /images/site
    rename: random
    extensions: [jpg, jpeg, png, webp, gif, avif, svg, ico]

content:
  - name: blog
    label: 博客文章
    type: collection
    path: src/content/blog
    description: 新文章默认保存为草稿；发布前检查日期、图片与文件名，文件名决定永久地址。
    filename:
      # A date/time prefix also works when a Chinese title slugifies to nothing.
      template: '{year}{month}{day}-{hour}{minute}{second}-{primary}.md'
      field: create
    format: yaml-frontmatter
    subfolders: false
    operations:
      rename: false
    view:
      primary: title
      fields: [title, pubDate, category, draft, featured]
      sort: [pubDate, title]
      search: [title, description, category, tags, author]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        options:
          minlength: 1
          maxlength: 120
      - name: description
        label: 摘要
        type: text
        required: true
        description: 用于文章列表、搜索引擎和社交分享。
        options:
          minlength: 1
          maxlength: 300
      - name: pubDate
        label: 发布时间
        type: date
        required: true
        description: 默认当前浏览器时间；未来日期不会自动延迟发布，请用草稿开关控制。
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: updatedDate
        label: 更新时间
        type: date
        default: ''
        description: 留空表示文章尚未更新。
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: cover
        label: 封面
        type: object
        required: true
        fields:
          - name: tone
            label: 默认封面色调
            type: select
            required: true
            default: mint
            description: 未设置封面图片时使用。
            options:
              values:
                - name: mint
                  label: 薄荷绿
                - name: sunset
                  label: 日落橙
                - name: ocean
                  label: 海洋蓝
                - name: plum
                  label: 李子紫
                - name: forest
                  label: 森林绿
          - name: label
            label: 封面标签
            type: string
            description: 留空时自动使用文章分类。
            options:
              maxlength: 32
          - name: url
            label: 兼容封面地址（通常留空）
            type: string
            description: 仅供历史内容兼容；新文章请使用下面的本地封面图片字段。
            pattern:
              regex: '^(https?://[^\s]+|/(?!/)[^\s]*)?$'
              message: 请填写 http/https 链接或以 / 开头的站内路径。
          - name: upload
            label: 封面图片
            type: image
            description: 上传或选择文章媒体库中的本地图片，建议 2:1；默认上传到 uploads，清空后使用默认色调或兼容封面。
            options:
              media: posts
              path: public/images/posts/uploads
              extensions: [jpg, jpeg, png, webp, gif, avif, svg]
          - name: alt
            label: 封面替代文本
            type: string
            description: 为图片提供简洁的无障碍说明。
      - name: draft
        label: 草稿
        type: boolean
        default: true
        description: 生产构建不会发布草稿文章。
      - name: featured
        label: 置顶文章
        type: boolean
        default: false
      - name: legacyViews
        label: 历史阅读量
        type: number
        default: 0
        description: 迁移前的历史阅读量，只能填写非负整数；新文章保持 0。
        options:
          min: 0
      - name: category
        label: 分类
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
        options:
          minlength: 1
        description: 每个标签单独添加；文章归档支持按标签筛选。
      - name: author
        label: 作者
        type: string
      - name: body
        label: 正文
        type: rich-text
        required: true
        description: 粘贴、拖入图片或通过 / → Image 上传到文章媒体库；默认存入 uploads，也可选择文章同名目录。复杂 Markdown 使用完整源码入口。
        options:
          format: markdown
          switcher: true
          media: posts
          path: public/images/posts/uploads
          extensions: [jpg, jpeg, png, webp, gif, avif, svg]

  - name: friends
    label: 友链名册
    type: collection
    path: src/content/friends
    description: 每个站点一份资料；访客通过 GitHub PR 申请，站长在这里维护收录结果。
    filename:
      template: '{year}{month}{day}-{hour}{minute}{second}-{primary}.md'
      field: create
    format: yaml-frontmatter
    subfolders: false
    operations:
      rename: false
    view:
      primary: name
      fields: [name, category, featured, hidden]
      search: [name, description, url, category, tags]
      sort: [name, submittedAt, updatedAt]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 站点名称
        type: string
        required: true
        options:
          minlength: 1
          maxlength: 40
      - name: url
        label: 站点链接
        type: string
        required: true
        pattern:
          regex: '^https?://[^\s]+$'
          message: 请填写完整的 http 或 https 链接。
      - name: description
        label: 站点简介
        type: text
        required: true
        options:
          minlength: 1
          maxlength: 80
      - name: avatar
        label: 头像图片
        type: image
        required: true
        description: 直接上传或选择友链头像媒体库中的本地图片；外部申请头像在合并前先下载到本地。
        options:
          media: friends
          path: public/images/friends
          extensions: [jpg, jpeg, png, webp, gif, avif, svg, ico]
      - name: category
        label: 分类
        type: select
        required: true
        default: 其他
        options:
          values: [技术, 生活, 创作, 游戏, 学习, 其他]
      - name: tags
        label: 标签
        type: string
        list:
          max: 4
          collapsible: false
        options:
          minlength: 1
          maxlength: 16
      - name: submittedAt
        label: 收录日期
        type: date
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: 更新日期
        type: date
        default: ''
        options:
          format: yyyy-MM-dd
      - name: featured
        label: 优先展示
        type: boolean
        default: false
      - name: hidden
        label: 隐藏
        type: boolean
        default: false
        description: 隐藏时保留资料文件，但不在公开友链页展示。

  - name: source
    label: 源码维护（高级）
    type: group
    items:
      - name: blog-source
        label: 文章完整源码
        type: collection
        path: src/content/blog
        description: 编辑完整 frontmatter 和 Markdown，适合原生 HTML、复杂表格、代码围栏元数据及历史日期格式；不经过富文本转换。
        filename:
          template: '{primary}.md'
          field: false
        format: code
        subfolders: false
        operations:
          create: false
          rename: false
          delete: false
  - name: site-settings
    label: 站点配置（高级）
    type: group
    items:
      - name: site
        label: 站点与作者资料
        type: file
        path: src/config/site.ts
        format: code
        operations:
          delete: false
      - name: navigation
        label: 导航配置
        type: file
        path: src/config/navigation.ts
        format: code
        operations:
          delete: false
      - name: page-content
        label: 页面文案与首页组件
        type: file
        path: src/config/content.ts
        format: code
        operations:
          delete: false
      - name: archives
        label: 归档配置
        type: file
        path: src/config/archives.ts
        format: code
        operations:
          delete: false
      - name: comments
        label: 评论配置
        type: file
        path: src/config/comments.ts
        format: code
        operations:
          delete: false
      - name: analytics
        label: 访问统计配置
        type: file
        path: src/config/analytics.ts
        format: code
        operations:
          delete: false
      - name: friend-links
        label: 友链页面与申请配置
        type: file
        path: src/config/friend-links.ts
        format: code
        operations:
          delete: false
      - name: theme
        label: 主题配置
        type: file
        path: src/config/theme.ts
        format: code
        operations:
          delete: false

actions:
  - name: validate-site
    label: 检查内容与构建
    workflow: validate.yml
    ref: current
    confirm: false

settings:
  content:
    # Preserve frontmatter keys that are intentionally not exposed in the CMS,
    # such as Astro's local `cover.image` metadata.
    merge: true
  commit:
    templates:
      create: 'content: add {filename}'
      update: 'content: update {filename}'
      delete: 'content: remove {filename}'
      rename: 'content: rename {oldFilename} -> {newFilename}'
